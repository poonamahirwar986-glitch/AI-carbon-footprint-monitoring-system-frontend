 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Entries</title>

    <!-- CSS -->
    <link rel="stylesheet" href="pastentries.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar" id="sidebar">

            <!-- LOGO -->

            <div class="logo-section">

                <div class="logo-icon">
                    <i class="fa-solid fa-leaf"></i>
                </div>

                <h2>Carbon Tracker</h2>

            </div>


            <!-- MENU -->

            <ul class="menu">

                <li>
                    <a href="Carbondashboard.html">

                        <i class="fa-solid fa-house"></i>

                        <span>Dashboard</span>

                    </a>
                </li>

                <li>
                    <a href="carbonCalculate.html">

                        <i class="fa-solid fa-calculator"></i>

                        <span>Calculate Carbon</span>

                    </a>
                </li>

                <li class="active">
                    <a href="pastentriespade.html">

                        <i class="fa-solid fa-clock-rotate-left"></i>

                        <span> Entries</span>

                    </a>
                </li>

                <li>
                    <a href="carbonreport.html">

                        <i class="fa-solid fa-file"></i>

                        <span>Reports</span>

                    </a>
                </li>
             

            <li>
                <a href="AIAdvisor.html">
                    <i class="fa-solid fa-robot">
                    </i>AI Advisor</a></li>
         
                <li>
                    <a href="profile.html">

                        <i class="fa-solid fa-user"></i>

                        <span>Profile</span>

                    </a>
                </li>

                <li>
                    <a href="setting.html">

                        <i class="fa-solid fa-gear"></i>

                        <span>Settings</span>

                    </a>
                </li>

            </ul>


            <!-- LOGOUT -->

            <div class="logout">

                <a href="carnbonsignup.html">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span>Logout</span>

                </a>

            </div>

        </aside>

        <!-- MAIN CONTENT -->

        <main class="main-content" id="main-content">

            <div class="topbar">

                <div class= "logo-menu" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                    
                </div>

                <div class="top-right">


                    <!-- NOTIFICATION -->

                    <div class="notification">

                        <i class="fa-regular fa-bell"></i>

                        <span class="badge">3</span>

                    </div>


                    <!-- PROFILE -->

                    <div class="profile">

                      <img id="topProfileImage" src="profileimage2.jpg" alt="Profile">
                       <div class="profile-info">
                            <h4 class="profile-name"></h4>
                            <p>User</p>

                        </div>

                        <i class="fa-solid fa-angle-down"></i>

                    </div>

                </div>

            </div>


            <!-- PAGE HEADER -->

            <div class="page-header">

                <h1> Entries</h1>

                <p>
                    View all your previously calculated carbon footprint records
                </p>

            </div>

            <div class="table-card">

                <div class="table-top">
                    
                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search entries..."
                        
                            >

                    </div>

                </div>


                <!-- TABLE -->

                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>

                                <th>Date</th>

                                <th>Electricity (kWh)</th>

                                <th>Travel (km)</th>

                                <th>Waste (kg)</th>

                                <th>Total CO₂ (kg)</th>

                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody id="entriesTableBody">


                            <!-- DYNAMIC DATA -->

                        </tbody>

                    </table>

                </div>


                <!-- PAGINATION -->

                <div class="pagination">

                    <button>
                        <i class="fa-solid fa-angle-left"></i>
                    </button>

                    <button class="active-page">1</button>

                    <button>2</button>

                    <button>3</button>

                    <button>
                        <i class="fa-solid fa-angle-right"></i>
                    </button>

                </div>

            </div>

        </main>

    </div>


    <script src="Auth.js"></script>
    <script src="pastentries.js"></script>

</body>
</html>
